
name: Better Restaurant CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restaurant_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d restaurant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restaurant_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restaurant_test
          SECRET_KEY: ci-test-secret-key-at-least-32-bytes-long
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
